<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Document/File Icon -->
  <rect x="6" y="3" width="17" height="24" rx="2" fill="url(#docGradient)"/>

  <!-- Document fold (top-right corner) -->
  <path d="M 23 3 L 23 8 L 18 8 L 23 3 Z" fill="#075985" opacity="0.3"/>

  <!-- Document lines (text representation) -->
  <line x1="9" y1="10" x2="20" y2="10" stroke="white" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <line x1="9" y1="14" x2="20" y2="14" stroke="white" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <line x1="9" y1="18" x2="16" y2="18" stroke="white" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <line x1="9" y1="22" x2="18" y2="22" stroke="white" stroke-width="1" opacity="0.7" stroke-linecap="round"/>

  <!-- Checkmark circle background (white border) -->
  <circle cx="24" cy="8" r="6.5" fill="white"/>

  <!-- Checkmark circle (accent color) -->
  <circle cx="24" cy="8" r="5.5" fill="#38bdf8"/>

  <!-- Checkmark symbol -->
  <path d="M 21.5 8 L 23 9.5 L 26.5 5.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
