name: Firestore Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Migration mode'
        required: true
        type: choice
        options:
          - dry-run
          - execute
        default: 'dry-run'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'

env:
  PROJECT_ID: carewell-automation
  REGION: asia-northeast1

jobs:
  validate-migration:
    name: Validate Migration
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/61759806259/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-sa@carewell-automation.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Firestore backup exists
        run: |
          echo "Checking for recent Firestore backups..."
          RECENT_BACKUP=$(gcloud firestore operations list \
            --database=carewell-native \
            --filter="metadata.operationType=EXPORT_DOCUMENTS AND metadata.state=SUCCESSFUL" \
            --limit=1 \
            --format="value(metadata.outputUriPrefix)")

          if [ -z "$RECENT_BACKUP" ]; then
            echo "⚠️  No recent backup found. Creating backup..."
            BACKUP_URI="gs://carewell-automation-backup/firestore-$(date +%Y%m%d-%H%M%S)"
            gcloud firestore export $BACKUP_URI --database=carewell-native --async
            echo "✅ Backup initiated: $BACKUP_URI"
          else
            echo "✅ Recent backup found: $RECENT_BACKUP"
          fi

      - name: Run migration dry-run
        run: |
          python scripts/migrate_parent_documents.py --dry-run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        with:
          name: migration-report-dry-run
          path: migration_report.json
        if: always()

  execute-migration:
    name: Execute Migration
    runs-on: ubuntu-latest
    needs: validate-migration
    if: github.event.inputs.mode == 'execute'

    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/61759806259/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-sa@carewell-automation.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create pre-migration backup
        run: |
          BACKUP_URI="gs://carewell-automation-backup/pre-migration-$(date +%Y%m%d-%H%M%S)"
          echo "Creating backup: $BACKUP_URI"
          gcloud firestore export $BACKUP_URI --database=carewell-native
          echo "BACKUP_URI=$BACKUP_URI" >> $GITHUB_ENV
          echo "✅ Backup created: $BACKUP_URI"

      - name: Execute migration
        id: migration
        run: |
          echo "🚀 Starting migration execution..."
          python scripts/migrate_parent_documents.py --execute | tee migration_output.log
          echo "✅ Migration completed"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}

      - name: Validate migration results
        run: |
          echo "🔍 Validating migration results..."

          # Check if validation_errors exists in report
          ERRORS=$(jq -r '.validation_errors | length' migration_report.json)

          if [ "$ERRORS" -gt "0" ]; then
            echo "❌ Migration validation failed with $ERRORS errors"
            jq '.validation_errors' migration_report.json
            exit 1
          else
            echo "✅ Migration validation successful"
          fi

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        with:
          name: migration-report-execute
          path: |
            migration_report.json
            migration_output.log
        if: always()

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Migration failed!"
          echo "Backup location: $BACKUP_URI"
          echo "Please review the migration report and logs."
          echo "To rollback, run: python scripts/rollback_parent_documents.py --confirm"

      - name: Create rollback script
        if: success()
        run: |
          cat > rollback.sh << 'EOF'
          #!/bin/bash
          echo "Rolling back migration..."
          gcloud run services update-traffic carewell-file-collector \
            --to-revisions PREVIOUS=100 \
            --region asia-northeast1
          python scripts/rollback_parent_documents.py --confirm
          echo "Rollback completed"
          EOF
          chmod +x rollback.sh

      - name: Upload rollback script
        uses: actions/upload-artifact@v4
        with:
          name: rollback-script
          path: rollback.sh
        if: success()
