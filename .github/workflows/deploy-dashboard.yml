name: Deploy Carewell Dashboard to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-dashboard.yml'

env:
  PROJECT_ID: carewell-automation
  WORKING_DIR: dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm install

      - name: Build application
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build
        env:
          # Firebase設定は後でSecrets/Variablesに追加
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/61759806259/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-sa@carewell-automation.iam.gserviceaccount.com'

      - name: Setup Firebase CLI
        run: |
          npm install -g firebase-tools

      - name: Deploy Firestore Security Rules
        run: |
          firebase deploy --only firestore:rules --project ${{ env.PROJECT_ID }} --non-interactive

      - name: Deploy to Firebase Hosting
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          firebase deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
