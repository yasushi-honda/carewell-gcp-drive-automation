name: Deploy to Cloud Run Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deployment only)'
        required: false
        type: boolean
        default: false

env:
  PROJECT_ID: carewell-automation
  REGION: asia-northeast1
  FUNCTION_NAME: carewell-file-collector
  ARTIFACT_REGISTRY: asia-northeast1-docker.pkg.dev/carewell-automation/carewell-functions

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src

      # Integration tests temporarily disabled: Firestore Emulator startup issue in GitHub Actions
      # To re-enable: remove 'if: false' from the steps below
      - name: Set up Firebase CLI
        if: false
        run: npm install -g firebase-tools

      - name: Start Firestore Emulator
        if: false
        run: |
          firebase emulators:start --only firestore --project demo-test &
          sleep 10

      - name: Run integration tests
        if: false
        continue-on-error: true
        timeout-minutes: 5
        run: |
          pytest tests/integration/ -v --timeout=60
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCP_PROJECT: demo-test

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/61759806259/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-sa@carewell-automation.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${ARTIFACT_REGISTRY}/${FUNCTION_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="${ARTIFACT_REGISTRY}/${FUNCTION_NAME}:latest"

          docker build -t ${IMAGE_TAG} -t ${IMAGE_LATEST} .
          docker push ${IMAGE_TAG}
          docker push ${IMAGE_LATEST}

      - name: Deploy to Cloud Run Functions
        run: |
          gcloud run deploy ${FUNCTION_NAME} \
            --image ${ARTIFACT_REGISTRY}/${FUNCTION_NAME}:${GITHUB_SHA} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --timeout 3000 \
            --service-account github-actions-sa@carewell-automation.iam.gserviceaccount.com \
            --set-env-vars "GCP_PROJECT=${PROJECT_ID}" \
            --set-secrets "CAREWELL_USER_ID=carewell-user-id:latest,CAREWELL_PASSWORD=carewell-password:latest"
